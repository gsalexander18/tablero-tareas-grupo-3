name: Cypress CI
on:
  push:
  pull_request:
jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: 'http://127.0.0.1:3000'
          wait-on-timeout: 120
      - name: Guardar video y capturas de Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-cypress
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore
